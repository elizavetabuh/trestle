<meta charset="utf-8">
<title>Trestle Operations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme:light;
    --bg:#f9f9f7; --surface:#ffffff; --surface-2:#fcfcfb; --surface-sunken:#f3f2ee;
    --border:rgba(11,11,11,0.10); --border-strong:rgba(11,11,11,0.16);
    --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --accent:#2a78d6; --accent-ink:#ffffff; --accent-wash:#e8f1fb;
    --good:#0ca30c; --good-text:#006300; --good-wash:#e5f6e5;
    --warn:#fab219; --warn-text:#8a5a00; --warn-wash:#fff4de;
    --serious:#ec835a; --serious-text:#a3431f; --serious-wash:#fdeae2;
    --crit:#d03b3b; --crit-text:#a81f1f; --crit-wash:#fbe7e7;
    --s1:#2a78d6; --s2:#eb6834;
    --shadow-md:0 8px 24px -8px rgba(11,11,11,0.14), 0 2px 6px -2px rgba(11,11,11,0.08);
    --shadow-lg:0 20px 48px -12px rgba(11,11,11,0.26);
    --radius:10px; --radius-sm:6px;
    --font-ui:'IBM Plex Sans',system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0d0d0d; --surface:#171716; --surface-2:#1a1a19; --surface-sunken:#131312;
      --border:rgba(255,255,255,0.11); --border-strong:rgba(255,255,255,0.18);
      --ink:#f5f5f3; --ink-2:#c3c2b7; --ink-3:#8f8d85;
      --grid:#2c2c2a; --accent:#3987e5; --accent-ink:#ffffff; --accent-wash:#132234;
      --good:#19c219; --good-text:#4fde4f; --good-wash:#102410;
      --warn:#fab219; --warn-text:#ffcf6b; --warn-wash:#2b2008;
      --serious:#ec835a; --serious-text:#f5a580; --serious-wash:#2c1710;
      --crit:#e66767; --crit-text:#ff9b9b; --crit-wash:#2c1414;
      --s1:#3987e5; --s2:#d95926;
      --shadow-md:0 8px 24px -8px rgba(0,0,0,0.5), 0 2px 6px -2px rgba(0,0,0,0.4);
      --shadow-lg:0 20px 48px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#171716; --surface-2:#1a1a19; --surface-sunken:#131312;
    --border:rgba(255,255,255,0.11); --border-strong:rgba(255,255,255,0.18);
    --ink:#f5f5f3; --ink-2:#c3c2b7; --ink-3:#8f8d85;
    --grid:#2c2c2a; --accent:#3987e5; --accent-ink:#ffffff; --accent-wash:#132234;
    --good:#19c219; --good-text:#4fde4f; --good-wash:#102410;
    --warn:#fab219; --warn-text:#ffcf6b; --warn-wash:#2b2008;
    --serious:#ec835a; --serious-text:#f5a580; --serious-wash:#2c1710;
    --crit:#e66767; --crit-text:#ff9b9b; --crit-wash:#2c1414;
    --s1:#3987e5; --s2:#d95926;
    --shadow-md:0 8px 24px -8px rgba(0,0,0,0.5), 0 2px 6px -2px rgba(0,0,0,0.4);
    --shadow-lg:0 20px 48px -12px rgba(0,0,0,0.6);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  #root{height:100%;}
  img{max-width:100%;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}
  .tnum{font-variant-numeric:tabular-nums;}
  .mono{font-family:var(--font-mono);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;height:100%;}
  .app.collapsed{grid-template-columns:72px 1fr;}
  .sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;white-space:nowrap;}
  .brand-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-name{font-weight:600;font-size:15px;letter-spacing:-0.01em;}
  .nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;border:none;background:transparent;color:var(--ink-2);text-align:left;white-space:nowrap;position:relative;}
  .nav-item svg{flex:none;}
  .nav-item:hover{background:var(--surface-sunken);color:var(--ink);}
  .nav-item.active{background:var(--ink);color:var(--bg);}
  .nav-item .nlabel{font-size:13.5px;font-weight:500;}
  .nav-section{margin-top:auto;padding:10px;border-top:1px solid var(--border);}
  .collapse-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink-3);width:100%;}
  .collapse-btn:hover{color:var(--ink);border-color:var(--border-strong);}
  .collapsed .nlabel,.collapsed .brand-name,.collapsed .collapse-label{display:none;}
  .collapsed .brand{justify-content:center;padding:18px 0 14px;}
  .collapsed .nav-item{justify-content:center;}

  .main{display:flex;flex-direction:column;min-width:0;height:100%;}
  .topbar{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--border);background:var(--surface);}
  .crumb{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .crumb b{color:var(--ink);font-weight:600;}
  .search{flex:1;max-width:360px;display:flex;align-items:center;gap:8px;background:var(--surface-sunken);border:1px solid transparent;border-radius:8px;padding:7px 10px;color:var(--ink-3);}
  .search input{background:none;border:none;outline:none;width:100%;color:var(--ink);}
  .topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-2);position:relative;}
  .icon-btn:hover{background:var(--surface-sunken);color:var(--ink);}
  .badge-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:1.5px solid var(--surface);}
  .copilot-trigger{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 10px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13px;}
  .copilot-trigger:hover{background:var(--surface-sunken);}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:none;}
  .avatar.sm{width:24px;height:24px;font-size:10px;}
  .avatar-stack{display:flex;}
  .avatar-stack .avatar{margin-left:-8px;border:2px solid var(--surface);}
  .avatar-stack .avatar:first-child{margin-left:0;}

  .content{flex:1;overflow-y:auto;padding:22px 26px 60px;}
  .content-narrow{max-width:1400px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .page-title{font-size:22px;font-weight:600;letter-spacing:-0.01em;margin:0 0 4px;}
  .page-sub{color:var(--ink-3);font-size:13px;margin:0;}
  .eyebrow{text-transform:uppercase;letter-spacing:0.07em;font-size:11px;color:var(--ink-3);font-weight:600;}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:13px;white-space:nowrap;}
  .btn:hover{background:var(--surface-sunken);}
  .btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .btn-primary:hover{opacity:0.88;}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-sunken);}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
  .card-pad{padding:18px;}

  /* KPI tiles */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;}
  .kpi-label{font-size:12px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:9px;}
  .kpi-value{font-size:26px;font-weight:650;letter-spacing:-0.01em;}
  .kpi-delta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:7px;}

  .grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;align-items:start;}

  /* Status pill */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5;}
  .pill .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .pill-good{background:var(--good-wash);color:var(--good-text);} .pill-good .dot{background:var(--good);}
  .pill-warn{background:var(--warn-wash);color:var(--warn-text);} .pill-warn .dot{background:var(--warn);}
  .pill-serious{background:var(--serious-wash);color:var(--serious-text);} .pill-serious .dot{background:var(--serious);}
  .pill-crit{background:var(--crit-wash);color:var(--crit-text);} .pill-crit .dot{background:var(--crit);}
  .pill-neutral{background:var(--surface-sunken);color:var(--ink-2);} .pill-neutral .dot{background:var(--ink-3);}
  .pill-info{background:var(--accent-wash);color:var(--accent);} .pill-info .dot{background:var(--accent);}

  /* Tables */
  table{width:100%;border-collapse:collapse;}
  .table-wrap{overflow-x:auto;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-3);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--ink);}
  th.num,td.num{text-align:right;}
  td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover td{background:var(--surface-sunken);}
  tr.muted td{opacity:0.55;}
  .cell-primary{font-weight:600;}
  .cell-sub{color:var(--ink-3);font-size:12px;margin-top:1px;}

  .progress{width:84px;height:6px;border-radius:4px;background:var(--surface-sunken);overflow:hidden;}
  .progress > div{height:100%;background:var(--ink);border-radius:4px;}
  .progress-row{display:flex;align-items:center;gap:8px;}
  .progress-pct{font-size:12px;color:var(--ink-3);width:30px;flex:none;}

  .filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);}
  .chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg);}
  .chip:hover:not(.active){background:var(--surface-sunken);}
  .search-input{display:flex;align-items:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:200px;}
  .search-input input{border:none;outline:none;background:none;width:100%;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .tab{padding:10px 4px;margin-right:22px;border:none;background:none;font-weight:600;font-size:13.5px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);}

  /* Risk card */
  .risk{display:flex;gap:11px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);position:relative;overflow:hidden;}
  .risk + .risk{margin-top:9px;}
  .risk::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
  .risk.sev-critical::before{background:var(--crit);} .risk.sev-serious::before{background:var(--serious);} .risk.sev-warning::before{background:var(--warn);}
  .risk-icon{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .risk.sev-critical .risk-icon{background:var(--crit-wash);color:var(--crit-text);}
  .risk.sev-serious .risk-icon{background:var(--serious-wash);color:var(--serious-text);}
  .risk.sev-warning .risk-icon{background:var(--warn-wash);color:var(--warn-text);}
  .risk-title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .risk-desc{color:var(--ink-2);font-size:13px;margin-top:3px;line-height:1.45;}
  .risk-meta{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .source-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);background:var(--surface-sunken);padding:3px 8px;border-radius:6px;font-family:var(--font-mono);}
  .risk-actions{margin-left:auto;display:flex;gap:6px;flex:none;}

  /* Copilot panel */
  .overlay{position:fixed;inset:0;background:rgba(11,11,11,0.28);z-index:40;}
  .copilot{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:41;display:flex;flex-direction:column;}
  .copilot-head{padding:16px 16px 12px;border-bottom:1px solid var(--border);}
  .copilot-head-top{display:flex;align-items:center;justify-content:between;gap:8px;}
  .copilot-title{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;}
  .scope-select{display:flex;align-items:center;gap:6px;margin-top:10px;}
  .scope-select select{border:1px solid var(--border-strong);background:var(--surface-sunken);border-radius:7px;padding:5px 8px;font-size:12.5px;font-weight:600;}
  .copilot-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;}
  .prompt-chip{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);font-size:12.75px;color:var(--ink-2);margin-bottom:7px;}
  .prompt-chip:hover{border-color:var(--border-strong);color:var(--ink);background:var(--surface-sunken);}
  .msg{max-width:92%;}
  .msg-user{align-self:flex-end;background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:11px 11px 3px 11px;font-size:13.5px;}
  .msg-ai{align-self:flex-start;width:100%;}
  .msg-ai-bubble{background:var(--accent-wash);border:1px solid rgba(42,120,214,0.18);padding:11px 13px;border-radius:3px 11px 11px 11px;font-size:13.25px;line-height:1.55;white-space:pre-line;}
  .msg-sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .src-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--border-strong);color:var(--ink-2);}
  .src-chip:hover{color:var(--accent);border-color:var(--accent);}
  .copilot-foot{border-top:1px solid var(--border);padding:12px;}
  .copilot-input{display:flex;gap:8px;align-items:center;border:1px solid var(--border-strong);border-radius:10px;padding:5px 5px 5px 12px;background:var(--surface-2);}
  .copilot-input input{flex:1;border:none;outline:none;background:none;padding:6px 0;}
  .send-btn{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;border:none;flex:none;}
  .send-btn:disabled{opacity:0.35;}
  .ai-sparkle{color:var(--accent);}

  .health-rail{display:flex;flex-direction:column;gap:10px;}
  .rail-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
  .rail-row:last-child{border-bottom:none;}
  .rail-label{font-size:12.5px;color:var(--ink-3);}
  .rail-value{font-weight:600;font-size:13px;}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start;}
  .board-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:10px;min-height:120px;}
  .board-col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;}
  .board-col-title{font-weight:600;font-size:12.5px;}
  .count-badge{font-size:11px;background:var(--surface-sunken);color:var(--ink-3);padding:1px 7px;border-radius:999px;font-weight:600;}
  .task-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;margin-bottom:8px;}
  .task-card-title{font-size:12.75px;font-weight:600;line-height:1.35;margin-bottom:7px;}
  .task-meta-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .trade-tag{font-size:10.5px;font-weight:600;color:var(--ink-3);background:var(--surface-sunken);padding:2px 7px;border-radius:5px;}
  .task-due{font-size:11px;color:var(--ink-3);font-family:var(--font-mono);}
  .task-due.overdue{color:var(--crit-text);font-weight:700;}
  .task-select{width:100%;margin-top:8px;font-size:11.5px;padding:5px 6px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);}
  .blocked-reason-box{margin-top:8px;}
  .blocked-reason-box textarea{width:100%;border:1px solid var(--border-strong);border-radius:6px;padding:6px 7px;font-size:11.5px;resize:vertical;min-height:40px;font-family:var(--font-ui);}
  .blocked-reason-actions{display:flex;gap:6px;margin-top:6px;}

  .ai-summary-card{background:linear-gradient(180deg,var(--accent-wash),var(--surface) 70%);border:1px solid rgba(42,120,214,0.2);border-radius:var(--radius);padding:17px 18px;}
  .ai-summary-head{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13.5px;margin-bottom:9px;color:var(--accent);}
  .ai-summary-text{font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-line;}

  .doc-grid-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-3);}
  .empty svg{margin-bottom:10px;opacity:0.5;}

  .milestone-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
  .milestone-row:last-child{border-bottom:none;}
  .ms-dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--border-strong);}
  .ms-dot.done{background:var(--good);box-shadow:none;}
  .ms-dot.risk{background:var(--warn);box-shadow:none;}
  .ms-name{font-weight:600;font-size:13px;}
  .ms-date{font-size:12px;color:var(--ink-3);margin-left:auto;font-family:var(--font-mono);}

  .section-title{font-size:14.5px;font-weight:650;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
  .link-btn{font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:none;}
  .link-btn:hover{text-decoration:underline;}

  .proj-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .proj-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .proj-meta-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:7px;color:var(--ink-3);font-size:12.75px;}
  .proj-meta-row span{display:flex;align-items:center;gap:5px;}

  .layout-with-rail{display:grid;grid-template-columns:1fr 268px;gap:18px;align-items:start;}

  .bottom-nav{display:none;}

  @media (max-width: 1180px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
    .board{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width: 1023px){
    .app{grid-template-columns:72px 1fr;}
    .brand-name,.nlabel,.collapse-label{display:none;}
    .brand{justify-content:center;padding:18px 0 14px;}

function fmtMoney(n,opts={}){
  const abs=Math.abs(n);

  if(opts.compact && abs>=1000) return (n<0?'-':'')+'$'+(abs/1000).toFixed(0)+'K';
  return (n<0?'-$':'$')+abs.toLocaleString('en-US',{maximumFractionDigits:0});
}
function fmtPct(n,digits=1){return (n>0?'+':'')+n.toFixed(digits)+'%';}

function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0;}return Math.abs(h);}
function seededRand(key){return mulberry32(hashStr(key));}

/* ---------- Generator: builds cost codes, tasks, documents, change orders, daily logs ---------- */
function generateProjectData(seed){
  const rnd = seededRand(seed.id);
  const phaseIdx = PHASE_ORDER.indexOf(seed.phase);
  const revisedBudget = seed.contract; // base; COs layered below

  // Change orders
  const coCount = seed.riskTilt==='critical' ? 3 : seed.riskTilt==='high' ? 2 : (rnd()<0.4?1:0);
  let coTotal = 0;
  const changeOrders = [];
  for(let i=0;i<coCount;i++){
    const amt = Math.round(seed.contract * (0.006 + rnd()*0.022));
    const status = i===coCount-1 && seed.riskTilt!=='none' ? 'Pending' : (rnd()<0.85?'Approved':'Rejected');
    if(status==='Approved') coTotal += amt;
    changeOrders.push({
      id:`${seed.id}-co-${i+1}`,
      number:`CO-${String(i+1).padStart(3,'0')}`,
      description: CO_REASONS[Math.floor(rnd()*CO_REASONS.length)],
      amount: amt,
      status,
      submittedBy: TEAM[seed.pm].name,
      date: addDays(seed.start, Math.floor(rnd()*daysBetween(seed.start,TODAY||seed.target))+20),
    });
  }
  const revised = seed.contract + coTotal;

  // Cost codes
  const activeCodes = COST_CODE_TEMPLATE.filter((c,i)=> seed.phase==='Closeout' ? true : i <= phaseIdx*1.8+3).slice(0,9);
  const overrunIdx = seed.riskTilt==='none' ? -1 : Math.floor(rnd()*activeCodes.length);
  const costCodes = activeCodes.map((c,i)=>{
    const budgeted = Math.round(revised * c.weight);
    const progressFactor = Math.min(1, seed.percentComplete/100 + 0.08);
    let committed = Math.round(budgeted * progressFactor * (0.9+rnd()*0.18));
    let actual = Math.round(committed * (0.88+rnd()*0.1));
    if(i===overrunIdx){
      const overrunMult = seed.riskTilt==='critical' ? 1.28+rnd()*0.1 : 1.14+rnd()*0.08;
      committed = Math.round(budgeted * Math.max(progressFactor,0.7) * overrunMult);
      actual = Math.round(committed * 0.95);
    }
    const forecast = Math.round(actual + (budgeted-actual>0 && progressFactor<1 ? (budgeted-committed)*0.15 : (committed-budgeted>0?committed-budgeted:0)) + (i===overrunIdx? budgeted*0.05:0));
    const forecastFinal = i===overrunIdx ? Math.round(budgeted*(seed.riskTilt==='critical'?1.3:1.15)) : Math.round(budgeted*(0.97+rnd()*0.05));
    return {code:c.code,name:c.name,budgeted,committed,actual,forecast:forecastFinal,variancePct:((forecastFinal-budgeted)/budgeted)*100,flagged:i===overrunIdx};
  });
  const totalBudgeted = costCodes.reduce((s,c)=>s+c.budgeted,0);
  const totalCommitted = costCodes.reduce((s,c)=>s+c.committed,0);
  const totalActual = costCodes.reduce((s,c)=>s+c.actual,0);
  const totalForecast = costCodes.reduce((s,c)=>s+c.forecast,0);

  // Tasks
  const phasesInvolved = PHASE_ORDER.slice(Math.max(0,phaseIdx-1), phaseIdx+1);
  const assigneePool = [seed.pm, seed.super, 'hard-hat'];
  const tasks = [];
  let tIdx=0;
  phasesInvolved.forEach((ph,pOff)=>{
    const names = TASK_TEMPLATES[ph]||[];
    names.forEach((title,i)=>{
      tIdx++;
      const isCurrentPhase = ph===seed.phase;
      let status;
      const r = rnd();
      if(!isCurrentPhase && pOff===0 && seed.phase!=='Sitework'){ status='completed'; }
      else if(isCurrentPhase){
        if(seed.riskTilt==='critical' && r<0.28) status='overdue';
        else if(seed.riskTilt==='critical' && r<0.4) status='blocked';
        else if((seed.riskTilt==='high') && r<0.18) status='overdue';
        else if(r<0.3) status='completed';
        else if(r<0.75) status='in-progress';
        else status='not-started';
      } else { status='not-started'; }
      const dueOffset = isCurrentPhase ? Math.floor(rnd()*18)-6 : Math.floor(rnd()*25)+8;
      const due = addDays(TODAY, status==='overdue' ? -Math.ceil(rnd()*9+1) : dueOffset);
      const assignee = assigneePool[Math.floor(rnd()*2)];
      tasks.push({
        id:`${seed.id}-t${tIdx}`, projectId:seed.id, title, phase:ph,
        trade: title.split(' — ')[0].split(' ').slice(-2).join(' '),
        assignee: TEAM[assignee]?TEAM[assignee].name:TEAM[seed.super].name,
        status: status==='overdue' ? 'in-progress' : status,
        overdueFlag: status==='overdue',
        dueDate: due, priority: (status==='overdue'||status==='blocked') ? 'High' : (rnd()<0.3?'High':'Normal'),
        blockedReason: status==='blocked' ? ['Inspection failed — rework required','Awaiting material delivery','Permit revision pending city review'][Math.floor(rnd()*3)] : null,
      });
    });
  });

  // Documents
  const docCount = 6 + Math.floor(rnd()*4);
  const shuffled = [...DOC_TEMPLATES].sort(()=>rnd()-0.5).slice(0,docCount);
  const documents = shuffled.map((d,i)=>({
    id:`${seed.id}-d${i+1}`, projectId:seed.id, name:d.name, category:d.cat, type:d.type,
    version: rnd()<0.2 ? `v${1+Math.floor(rnd()*3)}` : 'v1',
    status: rnd()<0.15 ? 'Superseded' : (rnd()<0.1?'Pending Review':'Current'),
    uploadedBy: TEAM[[seed.pm,seed.super,'dana-whitfield'][Math.floor(rnd()*3)]].name,
    date: addDays(TODAY, -Math.floor(rnd()*60)),
    size: `${(0.4+rnd()*8).toFixed(1)} MB`,
  }));

  // Daily logs (last 6 entries)
  const dailyLogs = [];
  for(let i=6;i>=1;i--){
    const date = addDays(TODAY, -i);
    const weather = WEATHER[Math.floor(rnd()*WEATHER.length)];
    const crew = 8+Math.floor(rnd()*22);
    const delayFlag = (seed.riskTilt==='critical' && i<=3) || (seed.riskTilt==='high' && i===2);
    const notes = delayFlag
      ? [`${weather==='Light Rain'?'Rain delayed exterior work by approx. 4 hrs; crew shifted to interior tasks.':'Inspection on '+seed.phase.toLowerCase()+' did not pass; rework scheduled.'}`]
      : [`Crew of ${crew} on site. ${seed.phase} work progressing as planned.`];
    dailyLogs.push({id:`${seed.id}-log${i}`, projectId:seed.id, date, weather, crew, note:notes[0], delayFlag});
  }

  // Milestones
  const msTemplate = ['Foundation Complete','Structure Topped Out','Building Enclosed (Dry-In)','Rough-In Complete','Substantial Completion','Certificate of Occupancy'];
  const startMs = new Date(seed.start), targetMs = new Date(seed.target);
  const totalSpan = (targetMs-startMs);
  const milestones = msTemplate.map((name,i)=>{
    const frac = (i+1)/msTemplate.length;
    const date = new Date(startMs.getTime()+totalSpan*frac).toISOString().slice(0,10);
    const passed = date < TODAY;
    const completed = passed && (i <= Math.floor((seed.percentComplete/100)*msTemplate.length));
    return {id:`${seed.id}-ms${i}`, projectId:seed.id, name, date, status: completed?'completed': (seed.riskTilt!=='none' && Math.abs(daysBetween(TODAY,date))<21 && !completed && passed ? 'at-risk' : 'upcoming')};
  });

  return {changeOrders, costCodes, budgetSummary:{original:seed.contract,coTotal,revised,totalBudgeted,totalCommitted,totalActual,totalForecast}, tasks, documents, dailyLogs, milestones};
}

const PROJECTS = PROJECT_SEED.map(seed=>{
  const gen = generateProjectData(seed);
  return {...seed, ...gen};
});

const ALL_TASKS = PROJECTS.flatMap(p=>p.tasks);

/* ============================================================
   RISK ENGINE  (deterministic, explainable)
   ============================================================ */
function computeAutoRisks(tasks, projects){
  const risks = [];
  // Rule 1 & 2: overdue / blocked tasks
  tasks.forEach(t=>{
    const proj = projects.find(p=>p.id===t.projectId);
    if(!proj) return;
    if(t.status==='blocked'){
      const daysToMs = Math.min(...proj.milestones.filter(m=>m.status!=='completed').map(m=>daysBetween(TODAY,m.date)).filter(d=>d>=0), 999);
      risks.push({
        id:`risk-blocked-${t.id}`, projectId:t.projectId, type:'schedule',
        severity: daysToMs<=10 ? 'critical' : 'warning',
        title:`Blocked task: ${t.title}`,
        description:`${t.title} is blocked — ${t.blockedReason||'reason not specified'}. Assigned to ${t.assignee}.`,
        source:'Task Tracking', sourceDetail:t.id, status:'open', detected:TODAY,
        recommendation:'Review blocker with assignee and reschedule dependent tasks if unresolved within 3 days.',
      });
    } else if(t.overdueFlag){
      const over = daysBetween(t.dueDate, TODAY);
      risks.push({
        id:`risk-overdue-${t.id}`, projectId:t.projectId, type:'schedule',
        severity: over>7 ? 'critical' : over>3 ? 'serious' : 'warning',
        title:`Overdue task: ${t.title}`,
        description:`${t.title} was due ${fmtDate(t.dueDate)} (${over} day${over===1?'':'s'} overdue), assigned to ${t.assignee}.`,
        source:'Task Tracking', sourceDetail:t.id, status:'open', detected:TODAY,
        recommendation:'Confirm current status with field team and update schedule or reassign resources.',
      });
    }
  });
  // Rule 3: budget threshold
  projects.forEach(p=>{
    p.costCodes.filter(c=>c.flagged).forEach(c=>{
      const pctOfBudget = c.committed / c.budgeted;
      if(pctOfBudget>=0.9 && p.percentComplete<90){
        risks.push({
          id:`risk-budget-${p.id}-${c.code}`, projectId:p.id, type:'budget',
          severity: c.variancePct>25 ? 'critical' : c.variancePct>12 ? 'serious' : 'warning',
          title:`Budget variance: ${c.name}`,
          description:`Cost code ${c.code} (${c.name}) is committed at ${fmtMoney(c.committed,{compact:true})} against a ${fmtMoney(c.budgeted,{compact:true})} budget — forecast ${fmtPct(c.variancePct)} vs. plan, while the project is only ${p.percentComplete}% complete.`,
          source:'Budget Variance', sourceDetail:c.code, status:'open', detected:TODAY,
          recommendation:'Review committed costs against remaining scope; confirm change order coverage or escalate to ownership.',
        });
      }
    });
  });
  // Weather/daily-log sourced narrative risks for flagged projects
  projects.forEach(p=>{
    const flaggedLogs = p.dailyLogs.filter(l=>l.delayFlag);
    if(flaggedLogs.length>=2){
      risks.push({
        id:`risk-weather-${p.id}`, projectId:p.id, type:'schedule',
        severity: flaggedLogs.length>=3 ? 'serious' : 'warning',
        title: flaggedLogs.some(l=>l.weather==='Light Rain') ? 'Recurring weather delays' : 'Recurring inspection failures',
        description:`${flaggedLogs.length} of the last 6 daily logs report delays (${flaggedLogs.map(l=>fmtDate(l.date)).join(', ')}).`,
        source:'Daily Log', sourceDetail:flaggedLogs[0].id, status:'open', detected:TODAY,
        recommendation:'Reassess remaining schedule float; consider added shift or resequencing to absorb lost days.',
      });
    }
  });
  return risks;
}
const INITIAL_RISKS = computeAutoRisks(ALL_TASKS, PROJECTS);

/* ============================================================
   SELECTORS
   ============================================================ */
function sevRank(s){return s==='critical'?3:s==='serious'?2:1;}

function deriveProject(proj, state){
  const risks = state.risks.filter(r=>r.projectId===proj.id && r.status==='open');
  const tasks = state.tasks.filter(t=>t.projectId===proj.id);
  const overdueCount = tasks.filter(t=>t.overdueFlag && t.status!=='completed').length;
  const blockedCount = tasks.filter(t=>t.status==='blocked').length;
  const scheduleRisks = risks.filter(r=>r.type==='schedule');
  const budgetRisks = risks.filter(r=>r.type==='budget');
  const worstSchedule = scheduleRisks.reduce((m,r)=>Math.max(m,sevRank(r.severity)),0);
  const worstBudget = budgetRisks.reduce((m,r)=>Math.max(m,sevRank(r.severity)),0);
  const scheduleHealth = proj.percentComplete>=100 ? 'good' : worstSchedule>=3 ? 'critical' : worstSchedule===2 ? 'serious' : worstSchedule===1 ? 'warning' : 'good';
  const budgetHealth = proj.percentComplete>=100 ? 'good' : worstBudget>=3 ? 'critical' : worstBudget===2 ? 'serious' : worstBudget===1 ? 'warning' : 'good';
  const worst = Math.max(worstSchedule,worstBudget);
  const status = proj.percentComplete>=100 ? 'completed' : worst>=3 ? 'delayed' : worst>=1 ? 'at-risk' : 'on-track';
  const variancePct = ((proj.budgetSummary.totalForecast-proj.budgetSummary.totalBudgeted)/proj.budgetSummary.totalBudgeted)*100;
  return {risks,openRiskCount:risks.length,overdueCount,blockedCount,scheduleHealth,budgetHealth,status,variancePct};
}

function portfolioKPIs(state){
  const derived = PROJECTS.map(p=>deriveProject(p,state));
  const active = PROJECTS.filter(p=>p.percentComplete<100);
  const atRisk = derived.filter((d,i)=>PROJECTS[i].percentComplete<100 && (d.status==='at-risk'||d.status==='delayed')).length;
  const totalBudgeted = PROJECTS.reduce((s,p)=>s+p.budgetSummary.totalBudgeted,0);
  const totalForecast = PROJECTS.reduce((s,p)=>s+p.budgetSummary.totalForecast,0);
  const variancePct = ((totalForecast-totalBudgeted)/totalBudgeted)*100;
  const overdueTasks = state.tasks.filter(t=>t.overdueFlag && t.status!=='completed').length;
  return {activeCount:active.length, atRiskCount:atRisk, totalBudgeted, totalForecast, variancePct, overdueTasks};
}

function statusToTone(status){
  if(status==='on-track'||status==='good'||status==='completed') return 'good';
  if(status==='at-risk'||status==='warning') return 'warn';
  if(status==='delayed'||status==='critical') return 'crit';
  if(status==='serious') return 'serious';
  return 'neutral';
}
function statusLabel(status){
  return {'on-track':'On Track','at-risk':'At Risk','delayed':'Delayed','completed':'Completed','good':'Good','warning':'Warning','critical':'Critical','serious':'Serious'}[status]||status;
}

/* ============================================================
   STORE
   ============================================================ */
function reducer(state, action){
  switch(action.type){
    case 'MOVE_TASK': {
      const tasks = state.tasks.map(t=> t.id===action.taskId ? {...t, status:action.status, overdueFlag: action.status==='completed'?false:t.overdueFlag, blockedReason: action.status==='blocked'?action.reason:(action.status==='blocked'?t.blockedReason:null)} : t);
      return {...state, tasks};
    }
    case 'ADD_RISK': {
      if(state.risks.some(r=>r.id===action.risk.id)) return state;
      return {...state, risks:[action.risk, ...state.risks]};
    }
    case 'ACK_RISK': {
      const risks = state.risks.map(r=> r.id===action.riskId ? {...r, status:'acknowledged'} : r);
      return {...state, risks};
    }
    default: return state;
  }
}
const StoreCtx = createContext(null);
function useStore(){return useContext(StoreCtx);}

/* ============================================================
   AI COPILOT ENGINE
   ============================================================ */
function findProjectByName(q){
  const lower=q.toLowerCase();
  return PROJECTS.find(p=> lower.includes(p.name.toLowerCase()) || lower.includes(p.id.replace(/-/g,' ')) || p.name.toLowerCase().split(' ').some(w=>w.length>4 && lower.includes(w)));
}

function projectSummaryText(p, state){
  const d = deriveProject(p, state);
  const topRisk = d.risks.sort((a,b)=>sevRank(b.severity)-sevRank(a.severity))[0];
  let text = `${p.name} is ${d.status==='on-track'?'tracking on plan':d.status==='completed'?'complete and in closeout':d.status==='at-risk'?'showing early risk signals':'behind plan and needs attention'}. It's ${p.percentComplete}% complete, currently in ${p.phase}, with a schedule health of ${statusLabel(d.scheduleHealth)} and budget health of ${statusLabel(d.budgetHealth)}.\n\n`;
  text += `Budget: forecast is ${fmtMoney(p.budgetSummary.totalForecast,{compact:true})} against a ${fmtMoney(p.budgetSummary.totalBudgeted,{compact:true})} budget (${fmtPct(d.variancePct)} variance).`;
  if(p.budgetSummary.coTotal>0) text += ` ${p.changeOrders.length} change order${p.changeOrders.length===1?'':'s'} totaling ${fmtMoney(p.budgetSummary.coTotal,{compact:true})} ${p.changeOrders.length===1?'has':'have'} been factored in.`;
  text += `\n\n`;
  if(topRisk){
    text += `Top risk: ${topRisk.title} — ${topRisk.description} Recommended action: ${topRisk.recommendation}`;
  } else {
    text += `No open risks flagged — all tracked tasks and cost codes are within threshold.`;
  }
  return {text, sources: d.risks.slice(0,3).map(r=>({label:r.source+(r.sourceDetail?' · '+r.sourceDetail:''), risk:r}))};
}

function budgetAnswer(p, state){
  const d = deriveProject(p, state);
  const flagged = p.costCodes.filter(c=>c.flagged);
  let text = `${p.name}'s budget is forecast at ${fmtMoney(p.budgetSummary.totalForecast,{compact:true})} vs. a revised budget of ${fmtMoney(p.budgetSummary.totalBudgeted,{compact:true})} (${fmtPct(d.variancePct)}).`;
  if(flagged.length){
    const c=flagged[0];
    text += `\n\nThe main driver is ${c.name} (${c.code}): committed ${fmtMoney(c.committed,{compact:true})} against a ${fmtMoney(c.budgeted,{compact:true})} budget, forecasting ${fmtPct(c.variancePct)}.`;
    const relatedCO = p.changeOrders[0];
    if(relatedCO) text += ` This lines up with ${relatedCO.number} (${relatedCO.status.toLowerCase()}): "${relatedCO.description}," ${fmtMoney(relatedCO.amount,{compact:true})}.`;
  } else {
    text += ` No cost codes are currently over threshold.`;
  }
  return {text, sources: flagged.map(c=>({label:'Cost Code · '+c.code})).concat(p.changeOrders.slice(0,1).map(co=>({label:'Change Order · '+co.number})))};
}

function riskAnswer(scopeProjects, state){
  const allRisks = scopeProjects.flatMap(p=>deriveProject(p,state).risks.map(r=>({...r, projectName:p.name})))
    .sort((a,b)=>sevRank(b.severity)-sevRank(a.severity));
  if(!allRisks.length) return {text:'No open risks across the selected scope right now — everything is tracking within threshold.', sources:[]};
  const top = allRisks.slice(0,3);
  let text = `${allRisks.length} open risk${allRisks.length===1?'':'s'} across ${scopeProjects.length===1?scopeProjects[0].name:scopeProjects.length+' projects'}. Top priority:\n\n`;
  top.forEach((r,i)=>{ text += `${i+1}. [${r.projectName}] ${r.title} — ${r.description}\n`; });
  return {text:text.trim(), sources: top.map(r=>({label:r.source+' · '+r.projectName, risk:r}))};
}

function overdueAnswer(scopeProjects, state){
  const tasks = state.tasks.filter(t=>scopeProjects.some(p=>p.id===t.projectId) && t.overdueFlag && t.status!=='completed');
  if(!tasks.length) return {text:'No overdue tasks in this scope.', sources:[]};
  let text = `${tasks.length} overdue task${tasks.length===1?'':'s'}:\n\n`;
  tasks.slice(0,5).forEach(t=>{
    const proj = PROJECTS.find(p=>p.id===t.projectId);
    text += `• ${t.title} (${proj.name}) — due ${fmtDate(t.dueDate)}, assigned to ${t.assignee}\n`;
  });
  return {text:text.trim(), sources: tasks.slice(0,5).map(t=>({label:'Task Tracking · '+t.id}))};
}

function ownerUpdateAnswer(p, state){
  const d = deriveProject(p, state);
  let text = `Subject: Weekly Progress Update — ${p.name}\n\n`;
  text += `${p.name} is ${p.percentComplete}% complete and currently in the ${p.phase} phase. `;
  text += d.status==='on-track' ? `The project remains on schedule and on budget.` : d.status==='delayed' ? `We're actively managing schedule recovery — details below.` : `A few items need visibility this week — details below.`;
  text += `\n\nBudget: ${fmtMoney(p.budgetSummary.totalForecast,{compact:true})} forecast vs. ${fmtMoney(p.budgetSummary.totalBudgeted,{compact:true})} budget (${fmtPct(d.variancePct)}).\n`;
  text += `Schedule: ${statusLabel(d.scheduleHealth)}. ${d.overdueCount} task${d.overdueCount===1?'':'s'} currently overdue, ${d.blockedCount} blocked.\n`;
  if(d.risks[0]) text += `\nKey item: ${d.risks[0].title} — ${d.risks[0].recommendation}\n`;
  text += `\nHappy to walk through any of this on our regular call.`;
  return {text, sources: d.risks.slice(0,2).map(r=>({label:r.source, risk:r}))};
}

function portfolioBriefing(state, scopeProjects){
  const derived = scopeProjects.map(p=>({p, d:deriveProject(p,state)})).filter(x=>x.p.percentComplete<100);
  const worst = derived.filter(x=>x.d.status!=='on-track').sort((a,b)=>{
    const rank = s=>s==='delayed'?2:s==='at-risk'?1:0;
    return rank(b.d.status)-rank(a.d.status);
  }).slice(0,3);
  if(!worst.length){
    return {text:`All ${derived.length} active projects are tracking on schedule and on budget. No open risks need attention today.`, sources:[]};
  }
  let text = `${worst.length} project${worst.length===1?' needs':'s need'} attention this week:\n\n`;
  worst.forEach((x,i)=>{
    const top = x.d.risks.sort((a,b)=>sevRank(b.severity)-sevRank(a.severity))[0];
    text += `${i+1}. ${x.p.name} — ${statusLabel(x.d.status)}. ${top?top.title+'.':''}\n`;
  });
  return {text:text.trim(), sources: worst.map(x=>({label:x.p.name, projectId:x.p.id}))};
}

function copilotRespond(query, scope, state){
  const q = query.toLowerCase();
  const scopeProject = scope.type==='project' ? PROJECTS.find(p=>p.id===scope.projectId) : null;
  const mentioned = findProjectByName(q);
  const target = mentioned || scopeProject;

  if(/owner|weekly update|draft/.test(q) && target) return ownerUpdateAnswer(target, state);
  if(/budget|cost|over budget|variance/.test(q) && target) return budgetAnswer(target, state);
  if(/budget|cost|variance/.test(q)) {
    const worst = [...PROJECTS].sort((a,b)=>deriveProject(b,state).variancePct-deriveProject(a,state).variancePct)[0];
    return budgetAnswer(worst, state);
  }
  if(/overdue|late task/.test(q)) return overdueAnswer(target?[target]:PROJECTS, state);
  if(/risk|delay|behind|blocked|attention|trouble/.test(q)) return riskAnswer(target?[target]:PROJECTS, state);
  if(/summary|status|how is|how's|update on/.test(q) && target) return projectSummaryText(target, state);
  if(target) return projectSummaryText(target, state);
  return riskAnswer(PROJECTS, state);
}
</script>

<script type="text/babel" data-presets="react">
/* ============================================================
   PRIMITIVES
   ============================================================ */
function KPITile({label,value,tone,sub,bg}){
  return <div className="kpi" style={bg?{background:bg}:null}>
    <div className="kpi-label">{label}</div>
    <div className="kpi-value tnum" style={tone?{color: tone==='good'?'var(--good-text)':tone==='warn'?'var(--warn-text)':tone==='crit'?'var(--crit-text)':'inherit'}:null}>{value}</div>
    {sub && <div className="kpi-delta" style={{color:'var(--ink-3)',fontWeight:500}}>{sub}</div>}
  </div>;
}

function StatusPill({status}){
  return <span className={`pill pill-${statusToTone(status)}`}><span className="dot"/>{statusLabel(status)}</span>;
}

function Avatar({name,sm}){ return <div className={cx('avatar',sm&&'sm')} title={name}>{initials(name)}</div>; }

function ProgressBar({value}){
  return <div className="progress-row"><div className="progress"><div style={{width:Math.min(100,value)+'%'}}/></div><span className="progress-pct tnum">{value}%</span></div>;
}

function RiskCard({risk,projectName,showProject,onAck,onJump,mini}){
  const iconName = risk.severity==='critical' ? 'alert-octagon' : risk.type==='budget' ? 'dollar' : risk.type==='schedule' ? 'clock' : 'alert-triangle';
  return <div className={cx('risk',`sev-${risk.severity}`)} onClick={mini?onJump:undefined} style={mini?{cursor:'pointer'}:null}>
    <div className="risk-icon"><Icon name={iconName} size={16}/></div>
    <div style={{flex:1,minWidth:0}}>
      <div className="risk-title">{risk.title}{showProject && <span className="pill pill-neutral">{projectName}</span>}</div>
      <div className="risk-desc">{risk.description}</div>
      {!mini && <div className="risk-meta">
        <span className="source-chip"><Icon name="file-text" size={11}/>{risk.source}</span>
        {risk.status==='open' ? <div className="risk-actions">
          {onJump && <button className="btn btn-sm btn-ghost" onClick={(e)=>{e.stopPropagation();onJump();}}>View</button>}
          <button className="btn btn-sm" onClick={(e)=>{e.stopPropagation();onAck&&onAck();}}>Acknowledge</button>
        </div> : <span className="pill pill-good" style={{marginLeft:'auto'}}><Icon name="check" size={10}/>Acknowledged</span>}
      </div>}
    </div>
  </div>;
}

/* ============================================================
   CHARTS
   ============================================================ */
function GroupedBarChart({data,series,valueFmt,height=220}){
  const [hover,setHover]=useState(null);
  const fmt = valueFmt || (v=>v);
  const max = Math.max(1, ...data.flatMap(d=>series.map(s=>d[s.key]||0))) * 1.2;
  const W = Math.max(520, data.length*120), H=height, padL=56, padB=36, padT=14, padR=10;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const groupW = plotW/data.length;
  const barW = Math.min(26, (groupW-18)/series.length);
  const ticks=[0,0.25,0.5,0.75,1];
  return <div style={{overflowX:'auto'}}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',minWidth:W,height:H,display:'block'}} role="img" aria-label="Bar chart">
      {ticks.map(f=>{ const y=padT+plotH*(1-f); const val=max*f;
        return <g key={f}>
          <line x1={padL} x2={W-padR} y1={y} y2={y} style={{stroke:'var(--grid)',strokeWidth:1}}/>
          <text x={padL-8} y={y+4} textAnchor="end" fontSize="10" fontFamily="var(--font-mono)" style={{fill:'var(--ink-3)'}}>{fmt(val)}</text>
        </g>;
      })}
      {data.map((d,i)=>{
        const gx = padL + i*groupW;
        const groupInnerW = series.length*barW + (series.length-1)*3;
        const startX = gx + (groupW-groupInnerW)/2;
        return <g key={i}>
          {series.map((s,si)=>{
            const v=d[s.key]||0; const bh=Math.max(plotH*(v/max),1); const bx=startX+si*(barW+3); const by=padT+plotH-bh;
            const isHover = hover && hover.i===i && hover.si===si;
            return <g key={s.key}>
              <rect x={bx} y={by} width={barW} height={bh} rx="2.5" style={{fill:s.color}}
                onMouseEnter={()=>setHover({i,si})} onMouseLeave={()=>setHover(null)}/>
              {isHover && <text x={bx+barW/2} y={by-6} textAnchor="middle" fontSize="10.5" fontWeight="700" fontFamily="var(--font-mono)" style={{fill:'var(--ink)'}}>{fmt(v)}</text>}
            </g>;
          })}
          <text x={gx+groupW/2} y={H-12} textAnchor="middle" fontSize="10.5" style={{fill:'var(--ink-3)'}}>{d.label.length>15? d.label.slice(0,14)+'…':d.label}</text>
        </g>;
      })}
      <line x1={padL} x2={W-padR} y1={padT+plotH} y2={padT+plotH} style={{stroke:'var(--border-strong)',strokeWidth:1}}/>
    </svg>
  </div>;
}

/* ============================================================
   AI COPILOT PANEL
   ============================================================ */
function AICopilotPanel({state,dispatch,scope,setScope,onClose,navigate,messages,setMessages}){
  const [input,setInput]=useState('');
  const bodyRef=useRef(null);
  const scopeProject = scope.type==='project' ? PROJECTS.find(p=>p.id===scope.projectId) : null;
  const suggestions = scope.type==='project' && scopeProject
    ? [`Summarize ${scopeProject.name}'s status`, `Why is this project at risk?`, `Draft a weekly update for the owner`, `What's overdue on this project?`]
    : ['What needs my attention this week?', 'Summarize budget health across all projects', 'Which projects have overdue tasks?', 'Show me the biggest budget risk'];

  useEffect(()=>{
    if(messages.length===0){
      const resp = scope.type==='project' && scopeProject ? projectSummaryText(scopeProject,state) : portfolioBriefing(state, PROJECTS);
      setMessages([{role:'ai', text:resp.text, sources:resp.sources}]);
    }
    // eslint-disable-next-line
  },[]);

  useEffect(()=>{ if(bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; },[messages]);

  function send(text){
    const q=(text||input).trim(); if(!q) return;
    const resp = copilotRespond(q, scope, state);
    setMessages(m=>[...m, {role:'user',text:q}, {role:'ai',text:resp.text,sources:resp.sources}]);
    setInput('');
  }
  function jumpSource(src){
    if(src.risk){ navigate(`#/projects/${src.risk.projectId}/risks`); }
    else if(src.projectId){ navigate(`#/projects/${src.projectId}/overview`); }
  }

  return <>
    <div className="overlay" onClick={onClose}/>
    <div className="copilot" role="dialog" aria-label="AI Operations Copilot">
      <div className="copilot-head">
        <div className="copilot-head-top">
          <div className="copilot-title"><Icon name="sparkle" size={19} className="ai-sparkle"/>Operations Copilot</div>
          <button className="icon-btn" style={{marginLeft:'auto'}} onClick={onClose}><Icon name="x" size={17}/></button>
        </div>
        <div className="scope-select">
          <span style={{fontSize:12,color:'var(--ink-3)'}}>Scope</span>
          <select value={scope.type==='project'?scope.projectId:'portfolio'} onChange={e=>{const v=e.target.value; setScope(v==='portfolio'?{type:'portfolio'}:{type:'project',projectId:v});}}>
            <option value="portfolio">Portfolio — all projects</option>
            {PROJECTS.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
      </div>
      <div className="copilot-body" ref={bodyRef}>
        {messages.map((m,i)=> m.role==='user'
          ? <div key={i} className="msg msg-user">{m.text}</div>
          : <div key={i} className="msg msg-ai">
              <div className="msg-ai-bubble">{m.text}</div>
              {m.sources && m.sources.length>0 && <div className="msg-sources">
                {m.sources.map((s,si)=><button key={si} className="src-chip" onClick={()=>jumpSource(s)}><Icon name="external" size={10}/>{s.label}</button>)}
              </div>}
            </div>
        )}
        <div>
          <div className="eyebrow" style={{marginBottom:8}}>Try asking</div>
          {suggestions.map((s,i)=><button key={i} className="prompt-chip" onClick={()=>send(s)}>{s}</button>)}
        </div>
      </div>
      <div className="copilot-foot">
        <div className="copilot-input">
          <input placeholder="Ask about budget, schedule, or risk…" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter') send();}}/>
          <button className="send-btn" disabled={!input.trim()} onClick={()=>send()}><Icon name="send" size={14}/></button>
        </div>
      </div>
    </div>
  </>;
}

function relativeDays(dateStr){ const diff=daysBetween(dateStr,TODAY); if(diff<=0) return 'Today'; if(diff===1) return 'Yesterday'; return `${diff} days ago`; }

/* ---------------- Dashboard ---------------- */
function Dashboard(){
  const {state,navigate,openCopilot,dispatch}=useStore();
  const [scopeFilter,setScopeFilter]=useState('all');
  const scopeProjects = scopeFilter==='mine'? PROJECTS.filter(p=>p.pm===CURRENT_USER.id): PROJECTS;
  const derived = scopeProjects.map(p=>({p,d:deriveProject(p,state)}));
  const activeList = derived.filter(x=>x.p.percentComplete<100);
  const atRiskCount = activeList.filter(x=>x.d.status==='at-risk'||x.d.status==='delayed').length;
  const totalBudgeted = scopeProjects.reduce((s,p)=>s+p.budgetSummary.totalBudgeted,0);
  const totalForecast = scopeProjects.reduce((s,p)=>s+p.budgetSummary.totalForecast,0);
  const variancePct = ((totalForecast-totalBudgeted)/totalBudgeted)*100;
  const overdueTasks = state.tasks.filter(t=>t.overdueFlag && t.status!=='completed' && scopeProjects.some(p=>p.id===t.projectId)).length;
  const briefing = portfolioBriefing(state, scopeProjects);
  const risks = state.risks.filter(r=>r.status==='open' && scopeProjects.some(p=>p.id===r.projectId)).sort((a,b)=>sevRank(b.severity)-sevRank(a.severity)).slice(0,6);
  const milestones = scopeProjects.flatMap(p=>p.milestones.filter(m=>m.status!=='completed').map(m=>({...m,projectName:p.name}))).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,5);
  const chartProjects=[...scopeProjects].sort((a,b)=>b.contract-a.contract).slice(0,5);
  const chartData = chartProjects.map(p=>({label:p.name,budgeted:p.budgetSummary.totalBudgeted,forecast:p.budgetSummary.totalForecast}));
  function projName(id){ const p=PROJECTS.find(x=>x.id===id); return p?p.name:''; }

  return <div>
    <div className="page-head">
      <div><h1 className="page-title">Dashboard</h1><p className="page-sub">Portfolio overview — {activeList.length} active projects</p></div>
      <div className="filter-bar" style={{margin:0}}>
        <button className={cx('chip',scopeFilter==='all'&&'active')} onClick={()=>setScopeFilter('all')}>All Projects</button>
        <button className={cx('chip',scopeFilter==='mine'&&'active')} onClick={()=>setScopeFilter('mine')}>My Projects</button>
      </div>
    </div>
    <div className="kpi-row">
      <KPITile label="Active Projects" value={activeList.length} sub={`${scopeProjects.length-activeList.length} completed`}/>
      <KPITile label="Projects At Risk" value={atRiskCount} tone={atRiskCount>0?'warn':'good'} bg="var(--good-wash)" sub={`${activeList.length?Math.round(atRiskCount/activeList.length*100):0}% of active portfolio`}/>
      <KPITile label="Budget Variance" value={fmtPct(variancePct)} tone={variancePct>8?'crit':variancePct>3?'warn':'good'} sub={`${fmtMoney(totalForecast,{compact:true})} forecast`}/>
      <KPITile label="Tasks Overdue" value={overdueTasks} tone={overdueTasks>0?'crit':'good'} sub="across active projects"/>
    </div>
    <div className="ai-summary-card" style={{marginBottom:16}}>
      <div className="ai-summary-head"><Icon name="sparkle" size={15}/>AI Portfolio Briefing</div>
      <div className="ai-summary-text">{briefing.text}</div>
      <button className="btn btn-sm" style={{marginTop:12}} onClick={()=>openCopilot({type:'portfolio'})}><Icon name="sparkle" size={12}/>Open Copilot</button>
    </div>
    <div className="grid-2">
      <div className="card card-pad">
        <div className="section-title">Risk Feed<span className="eyebrow">{risks.length} open</span></div>
        {risks.length? risks.map(r=><RiskCard key={r.id} risk={r} projectName={projName(r.projectId)} showProject onAck={()=>dispatch({type:'ACK_RISK',riskId:r.id})} onJump={()=>navigate(`#/projects/${r.projectId}/risks`)}/>) : <div className="empty"><Icon name="check" size={28}/><div>No open risks across this scope.</div></div>}
      </div>
      <div className="card card-pad">
        <div className="section-title">Upcoming Milestones</div>
        {milestones.length? milestones.map(m=><div key={m.id} className="milestone-row"><span className={cx('ms-dot',m.status==='at-risk'&&'risk')}/><div style={{minWidth:0}}><div className="ms-name">{m.name}</div><div className="cell-sub">{m.projectName}</div></div><span className="ms-date">{fmtDateFull(m.date)}</span></div>) : <div className="empty">No upcoming milestones.</div>}
      </div>
    </div>
    <div className="card card-pad" style={{marginTop:14}}>
      <div className="section-title">Budget Burn — Top 5 Projects by Contract Value</div>
      <div style={{display:'flex',gap:14,marginBottom:10}}>
        <span style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--ink-2)'}}><span style={{width:10,height:10,borderRadius:2,background:'var(--ink-3)',display:'inline-block'}}/>Budgeted</span>
        <span style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--ink-2)'}}><span style={{width:10,height:10,borderRadius:2,background:'var(--s1)',display:'inline-block'}}/>Forecast</span>
      </div>
      <GroupedBarChart data={chartData} series={[{key:'budgeted',color:'var(--ink-3)'},{key:'forecast',color:'var(--s1)'}]} valueFmt={v=>fmtMoney(v,{compact:true})}/>
    </div>
  </div>;
}

/* ---------------- Projects List ---------------- */
function ProjectsList(){
  const {state,navigate}=useStore();
  const [statusFilter,setStatusFilter]=useState('all');
  const [search,setSearch]=useState('');
  const [sortKey,setSortKey]=useState('name');
  const [sortDir,setSortDir]=useState('asc');

  const rows = useMemo(()=>{
    let list = PROJECTS.map(p=>({p,d:deriveProject(p,state)}));
    if(statusFilter!=='all') list=list.filter(x=>x.d.status===statusFilter);
    if(search.trim()){ const q=search.toLowerCase(); list=list.filter(x=>x.p.name.toLowerCase().includes(q)||x.p.client.toLowerCase().includes(q)); }
    list.sort((a,b)=>{
      let av,bv;
      if(sortKey==='name'){av=a.p.name;bv=b.p.name;}
      else if(sortKey==='percent'){av=a.p.percentComplete;bv=b.p.percentComplete;}
      else if(sortKey==='variance'){av=a.d.variancePct;bv=b.d.variancePct;}
      else {av=a.p.dailyLogs[a.p.dailyLogs.length-1].date; bv=b.p.dailyLogs[b.p.dailyLogs.length-1].date;}
      if(typeof av==='string') return sortDir==='asc'? av.localeCompare(bv) : bv.localeCompare(av);
      return sortDir==='asc'? av-bv : bv-av;
    });
    return list;
  },[state,statusFilter,search,sortKey,sortDir]);

  function toggleSort(key){ if(sortKey===key) setSortDir(d=>d==='asc'?'desc':'asc'); else {setSortKey(key); setSortDir('asc');} }
  function sortIcon(key){ if(sortKey!==key) return null; return <Icon name={sortDir==='asc'?'arrow-up':'arrow-down'} size={11} style={{display:'inline',verticalAlign:'-1px',marginLeft:3}}/>; }

  const counts = {
    all: PROJECTS.length,
    'on-track': PROJECTS.filter(p=>deriveProject(p,state).status==='on-track').length,
    'at-risk': PROJECTS.filter(p=>deriveProject(p,state).status==='at-risk').length,
    'delayed': PROJECTS.filter(p=>deriveProject(p,state).status==='delayed').length,
    'completed': PROJECTS.filter(p=>deriveProject(p,state).status==='completed').length,
  };

  return <div>
    <div className="page-head"><div><h1 className="page-title">Projects</h1><p className="page-sub">{rows.length} of {PROJECTS.length} projects</p></div>
      <button className="btn btn-primary"><Icon name="plus" size={14}/>New Project</button>
    </div>
    <div className="filter-bar">
      {[['all','All'],['on-track','On Track'],['at-risk','At Risk'],['delayed','Delayed'],['completed','Completed']].map(([k,l])=>
        <button key={k} className={cx('chip',statusFilter===k&&'active')} onClick={()=>setStatusFilter(k)}>{l} <span style={{opacity:0.6}}>{counts[k]}</span></button>
      )}
      <div className="search-input" style={{marginLeft:'auto'}}>
        <Icon name="search" size={14}/><input placeholder="Search projects…" value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
    </div>
    <div className="card"><div className="table-wrap"><table>
      <thead><tr>
        <th className="sortable" onClick={()=>toggleSort('name')}>Project{sortIcon('name')}</th>
        <th>Phase</th>
        <th className="sortable" onClick={()=>toggleSort('percent')}>% Complete{sortIcon('percent')}</th>
        <th>Schedule</th>
        <th className="sortable num" onClick={()=>toggleSort('variance')}>Budget Variance{sortIcon('variance')}</th>
        <th>PM</th>
        <th className="sortable" onClick={()=>toggleSort('activity')}>Last Activity{sortIcon('activity')}</th>
      </tr></thead>
      <tbody>
        {rows.map(({p,d})=>
          <tr key={p.id} className="clickable" onClick={()=>navigate(`#/projects/${p.id}/overview`)}>
            <td><div className="cell-primary">{p.name}</div><div className="cell-sub">{p.client} · {p.city}</div></td>
            <td><span className="pill pill-neutral">{p.phase}</span></td>
            <td><ProgressBar value={p.percentComplete}/></td>
            <td><StatusPill status={d.scheduleHealth}/></td>
            <td className="num"><span className={`pill pill-${d.variancePct>12?'crit':d.variancePct>5?'warn':'good'}`}>{fmtPct(d.variancePct)}</span></td>
            <td><div style={{display:'flex',alignItems:'center',gap:7}}><Avatar name={TEAM[p.pm].name} sm/>{TEAM[p.pm].name}</div></td>
            <td className="cell-sub">{relativeDays(p.dailyLogs[p.dailyLogs.length-1].date)}</td>
          </tr>
        )}
      </tbody>
    </table>{!rows.length && <div className="empty">No projects match these filters.</div>}</div></div>
  </div>;
}
