function TasksTab({p,state,dispatch}){
  const [view,setView]=useState('board');
  const [pendingBlock,setPendingBlock]=useState(null);
  const tasks = state.tasks.filter(t=>t.projectId===p.id);
  const columns=[['not-started','Not Started'],['in-progress','In Progress'],['blocked','Blocked'],['completed','Completed']];

  function changeStatus(task,newStatus){
    if(newStatus==='blocked'){ setPendingBlock({taskId:task.id,reason:''}); return; }
    dispatch({type:'MOVE_TASK',taskId:task.id,status:newStatus});
  }
  function confirmBlock(taskId){
    const reason=(pendingBlock.reason||'').trim(); if(!reason) return;
    const task=tasks.find(t=>t.id===taskId);
    dispatch({type:'MOVE_TASK',taskId,status:'blocked',reason});
    const openMs = p.milestones.filter(m=>m.status!=='completed').map(m=>daysBetween(TODAY,m.date)).filter(x=>x>=0);
    const daysToMs = openMs.length? Math.min(...openMs) : 999;
    dispatch({type:'ADD_RISK',risk:{
      id:`risk-blocked-${taskId}-${Date.now()}`, projectId:p.id, type:'schedule',
      severity: daysToMs<=10?'critical':'warning',
      title:`Blocked task: ${task.title}`,
      description:`${task.title} is blocked — ${reason}. Assigned to ${task.assignee}.`,
      source:'Task Tracking', sourceDetail:taskId, status:'open', detected:TODAY,
      recommendation:'Review blocker with assignee and reschedule dependent tasks if unresolved within 3 days.',
    }});
    setPendingBlock(null);
  }

  return <div>
    <div className="filter-bar">
      <button className={cx('chip',view==='board'&&'active')} onClick={()=>setView('board')}><Icon name="grid" size={12}/>Board</button>
      <button className={cx('chip',view==='list'&&'active')} onClick={()=>setView('list')}><Icon name="menu" size={12}/>List</button>
    </div>
    {view==='board' ? <div className="board">
      {columns.map(([key,label])=>{
        const colTasks = tasks.filter(t=>t.status===key);
        return <div className="board-col" key={key}>
          <div className="board-col-head"><span className="board-col-title">{label}</span><span className="count-badge">{colTasks.length}</span></div>
          {colTasks.map(t=><div className="task-card" key={t.id}>
            <div className="task-card-title">{t.title}</div>
            <div className="task-meta-row"><span className="trade-tag">{t.trade}</span><span className={cx('task-due',t.overdueFlag&&'overdue')}>{t.overdueFlag?'Overdue · ':''}{fmtDate(t.dueDate)}</span></div>
            <div style={{fontSize:11.5,color:'var(--ink-3)',marginTop:5}}>{t.assignee}</div>
            <select className="task-select" value={t.status} onChange={e=>changeStatus(t,e.target.value)}>
              <option value="not-started">Not Started</option><option value="in-progress">In Progress</option><option value="blocked">Blocked</option><option value="completed">Completed</option>
            </select>
            {t.status==='blocked' && t.blockedReason && <div style={{fontSize:11,color:'var(--crit-text)',marginTop:6}}>⚠ {t.blockedReason}</div>}
            {pendingBlock && pendingBlock.taskId===t.id && <div className="blocked-reason-box">
              <textarea placeholder="Reason this task is blocked…" value={pendingBlock.reason} onChange={e=>setPendingBlock(pb=>({...pb,reason:e.target.value}))}/>
              <div className="blocked-reason-actions">
                <button className="btn btn-sm btn-primary" disabled={!pendingBlock.reason.trim()} onClick={()=>confirmBlock(t.id)}>Confirm Block</button>
                <button className="btn btn-sm btn-ghost" onClick={()=>setPendingBlock(null)}>Cancel</button>
              </div>
            </div>}
          </div>)}
          {!colTasks.length && <div style={{fontSize:12,color:'var(--ink-3)',padding:'10px 4px'}}>No tasks</div>}
        </div>;
      })}
    </div> : <div className="card"><div className="table-wrap"><table>
      <thead><tr><th>Task</th><th>Trade</th><th>Assignee</th><th>Due</th><th>Status</th><th>Priority</th></tr></thead>
      <tbody>{[...tasks].sort((a,b)=>new Date(a.dueDate)-new Date(b.dueDate)).map(t=>
        <tr key={t.id}>
          <td className="cell-primary">{t.title}</td><td>{t.trade}</td><td>{t.assignee}</td>
          <td className="mono" style={{color:t.overdueFlag?'var(--crit-text)':'inherit',fontWeight:t.overdueFlag?700:400}}>{fmtDate(t.dueDate)}{t.overdueFlag?' (overdue)':''}</td>
          <td><span className={`pill pill-${t.status==='completed'?'good':t.status==='blocked'?'crit':t.status==='in-progress'?'info':'neutral'}`}>{capitalize(t.status.replace('-',' '))}</span></td>
          <td>{t.priority}</td>
        </tr>
      )}</tbody>
    </table></div></div>}
  </div>;
}

function BudgetTab({p,d}){
  const bs=p.budgetSummary;
  const chartData=[...p.costCodes].sort((a,b)=>b.budgeted-a.budgeted).slice(0,8).map(c=>({label:c.name,budgeted:c.budgeted,actual:c.actual}));
  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div className="kpi-row">
      <KPITile label="Original Contract" value={fmtMoney(bs.original,{compact:true})}/>
      <KPITile label="Approved Change Orders" value={fmtMoney(bs.coTotal,{compact:true})}/>
      <KPITile label="Revised Budget" value={fmtMoney(bs.revised,{compact:true})}/>
      <KPITile label="Variance to Date" value={fmtPct(d.variancePct)} tone={d.variancePct>12?'crit':d.variancePct>5?'warn':'good'}/>
    </div>
    <div className="card card-pad">
      <div className="section-title">Budget vs. Actual by Cost Code</div>
      <div style={{display:'flex',gap:14,marginBottom:10}}>
        <span style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--ink-2)'}}><span style={{width:10,height:10,borderRadius:2,background:'var(--ink-3)',display:'inline-block'}}/>Budgeted</span>
        <span style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--ink-2)'}}><span style={{width:10,height:10,borderRadius:2,background:'var(--s1)',display:'inline-block'}}/>Actual</span>
      </div>
      <GroupedBarChart data={chartData} series={[{key:'budgeted',color:'var(--ink-3)'},{key:'actual',color:'var(--s1)'}]} valueFmt={v=>fmtMoney(v,{compact:true})}/>
    </div>
    <div className="card">
      <div className="card-pad" style={{paddingBottom:0}}><div className="section-title">Cost Codes</div></div>
      <div className="table-wrap"><table>
        <thead><tr><th>Code</th><th>Description</th><th className="num">Budgeted</th><th className="num">Committed</th><th className="num">Actual</th><th className="num">Forecast</th><th className="num">Variance</th></tr></thead>
        <tbody>{p.costCodes.map(c=>
          <tr key={c.code}>
            <td className="mono" style={{color:'var(--ink-3)'}}>{c.code}</td><td className="cell-primary">{c.name}</td>
            <td className="num tnum mono">{fmtMoney(c.budgeted)}</td><td className="num tnum mono">{fmtMoney(c.committed)}</td>
            <td className="num tnum mono">{fmtMoney(c.actual)}</td><td className="num tnum mono">{fmtMoney(c.forecast)}</td>
            <td className="num"><span className={`pill pill-${c.variancePct>12?'crit':c.variancePct>5?'warn':'good'}`}>{fmtPct(c.variancePct)}</span></td>
          </tr>
        )}</tbody>
      </table></div>
    </div>
    <ChangeOrdersTable cos={p.changeOrders}/>
  </div>;
}

function ChangeOrdersTable({cos}){
  const [expanded,setExpanded]=useState(null);
  return <div className="card">
    <div className="card-pad" style={{paddingBottom:0}}><div className="section-title">Change Orders</div></div>
    {cos.length ? <div className="table-wrap"><table>
      <thead><tr><th>Number</th><th>Description</th><th>Status</th><th className="num">Amount</th><th>Date</th></tr></thead>
      <tbody>{cos.map(co=><React.Fragment key={co.id}>
        <tr className="clickable" onClick={()=>setExpanded(e=>e===co.id?null:co.id)}>
          <td className="cell-primary mono">{co.number}</td><td>{co.description.length>44?co.description.slice(0,44)+'…':co.description}</td>
          <td><span className={`pill pill-${co.status==='Approved'?'good':co.status==='Pending'?'warn':'crit'}`}>{co.status}</span></td>
          <td className="num tnum mono">{fmtMoney(co.amount)}</td><td className="cell-sub">{fmtDate(co.date)}</td>
        </tr>
        {expanded===co.id && <tr><td colSpan="5" style={{background:'var(--surface-sunken)'}}>
          <div style={{padding:'8px 4px',fontSize:12.5}}><strong>Full description:</strong> {co.description}<br/><strong>Submitted by:</strong> {co.submittedBy}</div>
        </td></tr>}
      </React.Fragment>)}</tbody>
    </table></div> : <div className="empty">No change orders on this project.</div>}
  </div>;
}

function DocumentsTab({p}){
  const cats=['All',...new Set(p.documents.map(d=>d.category))];
  const [cat,setCat]=useState('All'); const [q,setQ]=useState('');
  const rows = p.documents.filter(d=>(cat==='All'||d.category===cat) && d.name.toLowerCase().includes(q.toLowerCase()));
  return <div>
    <div className="doc-grid-chips">{cats.map(c=><button key={c} className={cx('chip',cat===c&&'active')} onClick={()=>setCat(c)}>{c}</button>)}</div>
    <div className="search-input" style={{marginBottom:12,maxWidth:280}}><Icon name="search" size={14}/><input placeholder="Search documents…" value={q} onChange={e=>setQ(e.target.value)}/></div>
    <div className="card"><div className="table-wrap"><table>
      <thead><tr><th>Name</th><th>Category</th><th>Version</th><th>Status</th><th>Uploaded By</th><th>Date</th><th className="num">Size</th></tr></thead>
      <tbody>{rows.map(d=>
        <tr key={d.id} className={d.status==='Superseded'?'muted':''}>
          <td className="cell-primary"><Icon name="file-text" size={13} style={{marginRight:6,verticalAlign:'-2px',color:'var(--ink-3)'}}/>{d.name}</td>
          <td>{d.category}</td><td className="mono">{d.version}</td>
          <td><span className={`pill pill-${d.status==='Current'?'good':d.status==='Pending Review'?'warn':'neutral'}`}>{d.status}</span></td>
          <td>{d.uploadedBy}</td><td className="cell-sub">{fmtDate(d.date)}</td><td className="num mono">{d.size}</td>
        </tr>
      )}</tbody>
    </table>{!rows.length && <div className="empty">No documents match.</div>}</div></div>
  </div>;
}

function RisksTab({p,state,dispatch}){
  const [statusFilter,setStatusFilter]=useState('open');
  const risks = state.risks.filter(r=>r.projectId===p.id).filter(r=>statusFilter==='all'?true:r.status===statusFilter).sort((a,b)=>sevRank(b.severity)-sevRank(a.severity));
  return <div>
    <div className="filter-bar">
      {['open','acknowledged','all'].map(f=><button key={f} className={cx('chip',statusFilter===f&&'active')} onClick={()=>setStatusFilter(f)}>{capitalize(f)}</button>)}
    </div>
    {risks.length? risks.map(r=><RiskCard key={r.id} risk={r} onAck={()=>dispatch({type:'ACK_RISK',riskId:r.id})}/>) : <div className="empty"><Icon name="check" size={30}/><div>No risks in this view.</div></div>}
  </div>;
}

function TeamTab({p}){
  const pm=TEAM[p.pm], sup=TEAM[p.super];
  const assignees=[...new Set(p.tasks.map(t=>t.assignee))];
  return <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      {[pm,sup].map(person=><div className="card card-pad" key={person.id} style={{display:'flex',gap:12,alignItems:'flex-start'}}>
        <Avatar name={person.name}/>
        <div><div style={{fontWeight:650}}>{person.name}</div><div className="cell-sub">{person.role}</div>
          <div style={{fontSize:12,color:'var(--ink-3)',marginTop:6}}>{person.email}<br/>{person.phone}</div></div>
      </div>)}
    </div>
    <div className="card">
      <div className="card-pad" style={{paddingBottom:0}}><div className="section-title">Field Team</div></div>
      <div className="table-wrap"><table>
        <thead><tr><th>Name</th><th>Role</th><th>Company</th><th>Contact</th></tr></thead>
        <tbody>{assignees.map(name=>{
          const person = Object.values(TEAM).find(t=>t.name===name) || {role:'Field Crew',company:'Trestle GC',email:'—'};
          return <tr key={name}><td className="cell-primary">{name}</td><td>{person.role}</td><td>{person.company}</td><td className="cell-sub">{person.email}</td></tr>;
        })}</tbody>
      </table></div>
    </div>
  </div>;
}

function ProjectDetail({projectId,tab}){
  const {state,dispatch,navigate,openCopilot}=useStore();
  const p = PROJECTS.find(x=>x.id===projectId);
  if(!p) return <div className="empty">Project not found.</div>;
  const d = deriveProject(p,state);
  const activeTab = tab||'overview';
  const TABS=[['overview','Overview'],['tasks','Tasks'],['budget','Budget'],['documents','Documents'],['risks','Risks & Delays'],['team','Team']];
  return <div>
    <button className="btn btn-ghost btn-sm" onClick={()=>navigate('#/projects')} style={{marginBottom:12}}><Icon name="chevron-left" size={14}/>All Projects</button>
    <div className="proj-header">
      <div>
        <div className="proj-title-row">
          <h1 className="page-title" style={{margin:0}}>{p.name}</h1>
          <StatusPill status={d.status}/>
          <span className="pill pill-neutral">{p.phase}</span>
        </div>
        <div className="proj-meta-row">
          <span><Icon name="pin" size={13}/>{p.city}</span>
          <span><Icon name="building" size={13}/>{p.client}</span>
          <span><Icon name="dollar" size={13}/>{fmtMoney(p.contract,{compact:true})} contract</span>
          <span><Icon name="calendar" size={13}/>Target {fmtDateFull(p.target)}</span>
        </div>
      </div>
      <button className="btn btn-primary" onClick={()=>openCopilot({type:'project',projectId:p.id})}><Icon name="sparkle" size={14}/>Ask Copilot</button>
    </div>
    <div className="tabs">
      {TABS.map(([key,label])=><button key={key} className={cx('tab',activeTab===key&&'active')} onClick={()=>navigate(`#/projects/${p.id}/${key}`)}>{label}{key==='risks'&&d.openRiskCount>0?` (${d.openRiskCount})`:''}</button>)}
    </div>
    <div className="layout-with-rail">
      <div>
        {activeTab==='overview' && <OverviewTab p={p} d={d} state={state} navigate={navigate}/>}
        {activeTab==='tasks' && <TasksTab p={p} state={state} dispatch={dispatch}/>}
        {activeTab==='budget' && <BudgetTab p={p} d={d}/>}
        {activeTab==='documents' && <DocumentsTab p={p}/>}
        {activeTab==='risks' && <RisksTab p={p} state={state} dispatch={dispatch}/>}
        {activeTab==='team' && <TeamTab p={p}/>}
      </div>
      <aside className="card card-pad health-rail">
        <div className="section-title" style={{marginBottom:2}}>Health Summary</div>
        <div className="rail-row"><span className="rail-label">Schedule</span><StatusPill status={d.scheduleHealth}/></div>
        <div className="rail-row"><span className="rail-label">Budget</span><StatusPill status={d.budgetHealth}/></div>
        <div className="rail-row"><span className="rail-label">Open Risks</span><span className="rail-value">{d.openRiskCount}</span></div>
        <div className="rail-row"><span className="rail-label">Overdue Tasks</span><span className="rail-value">{d.overdueCount}</span></div>
        <div className="rail-row"><span className="rail-label">Project Manager</span><span className="rail-value">{TEAM[p.pm].name}</span></div>
        <div className="rail-row"><span className="rail-label">Superintendent</span><span className="rail-value">{TEAM[p.super].name}</span></div>
      </aside>
    </div>
  </div>;
}

function TasksGlobalPage(){
  const {state,navigate}=useStore();
  const [onlyMine,setOnlyMine]=useState(false);
  const [statusFilter,setStatusFilter]=useState('all');
  let tasks = state.tasks.map(t=>({...t, projectName: (PROJECTS.find(p=>p.id===t.projectId)||{}).name}));
  if(onlyMine) tasks = tasks.filter(t=>t.assignee===CURRENT_USER.name);
  if(statusFilter!=='all') tasks = tasks.filter(t=> statusFilter==='overdue' ? (t.overdueFlag && t.status!=='completed') : t.status===statusFilter);
  tasks = [...tasks].sort((a,b)=>(b.overdueFlag-a.overdueFlag) || (new Date(a.dueDate)-new Date(b.dueDate)));

  return <div>
    <div className="page-head"><div><h1 className="page-title">Tasks</h1><p className="page-sub">{tasks.length} tasks{onlyMine?' assigned to you':' across all projects'}</p></div></div>
    <div className="filter-bar">
      <button className={cx('chip',onlyMine&&'active')} onClick={()=>setOnlyMine(m=>!m)}><Icon name="users" size={12}/>Assigned to me</button>
      {['all','not-started','in-progress','blocked','completed','overdue'].map(f=><button key={f} className={cx('chip',statusFilter===f&&'active')} onClick={()=>setStatusFilter(f)}>{f==='all'?'All':capitalize(f.replace('-',' '))}</button>)}
    </div>
    <div className="card"><div className="table-wrap"><table>
      <thead><tr><th>Task</th><th>Project</th><th>Trade</th><th>Assignee</th><th>Due</th><th>Status</th><th>Priority</th></tr></thead>
      <tbody>{tasks.map(t=>
        <tr key={t.id} className="clickable" onClick={()=>navigate(`#/projects/${t.projectId}/tasks`)}>
          <td className="cell-primary">{t.title}</td><td>{t.projectName}</td><td>{t.trade}</td><td>{t.assignee}</td>
          <td className="mono" style={{color:t.overdueFlag&&t.status!=='completed'?'var(--crit-text)':'inherit',fontWeight:t.overdueFlag?700:400}}>{fmtDate(t.dueDate)}{t.overdueFlag&&t.status!=='completed'?' (overdue)':''}</td>
          <td><span className={`pill pill-${t.status==='completed'?'good':t.status==='blocked'?'crit':t.status==='in-progress'?'info':'neutral'}`}>{capitalize(t.status.replace('-',' '))}</span></td>
          <td>{t.priority}</td>
        </tr>
      )}</tbody>
    </table>{!tasks.length && <div className="empty">No tasks match these filters.</div>}</div></div>
  </div>;
}

/* ============================================================
   APP + ROUTER
   ============================================================ */
function parseRoute(hash){
  const parts=(hash||'#/dashboard').replace('#/','').split('/').filter(Boolean);
  if(parts[0]==='projects' && parts[1]) return {page:'project', projectId:parts[1], tab:parts[2]||'overview'};
  if(parts[0]==='projects') return {page:'projects'};
  if(parts[0]==='tasks') return {page:'tasks'};
  return {page:'dashboard'};
}

function App(){
  const [state,dispatch] = useReducer(reducer, {tasks:ALL_TASKS, risks:INITIAL_RISKS});
  const [hash,setHash] = useState(window.location.hash||'#/dashboard');
  useEffect(()=>{
    if(!window.location.hash){ window.location.hash='#/dashboard'; }
    const onHash=()=>{ setHash(window.location.hash); const el=document.querySelector('.content'); if(el) el.scrollTop=0; };
    window.addEventListener('hashchange',onHash);
    return ()=>window.removeEventListener('hashchange',onHash);
  },[]);
  const [collapsed,setCollapsed]=useState(false);
  const [copilotOpen,setCopilotOpen]=useState(false);
  const [copilotScope,setCopilotScope]=useState({type:'portfolio'});
  const [copilotMsgs,setCopilotMsgs]=useState([]);
  const [theme,setTheme]=useState(()=>{ try{ return localStorage.getItem('trestle-theme')||'system'; }catch(e){ return 'system'; } });
  useEffect(()=>{
    try{
      if(theme==='system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme',theme);
      localStorage.setItem('trestle-theme',theme);
    }catch(e){}
  },[theme]);

  function navigate(path){ window.location.hash=path; setHash(path); }
  function openCopilot(scope){ setCopilotScope(scope); setCopilotOpen(true); }

  const route = parseRoute(hash);
  const projForCrumb = route.page==='project' ? PROJECTS.find(p=>p.id===route.projectId) : null;
  const unreadRisks = state.risks.filter(r=>r.status==='open').length;
  const store = {state,dispatch,navigate,openCopilot};

  let pageEl;
  if(route.page==='dashboard') pageEl=<Dashboard/>;
  else if(route.page==='projects') pageEl=<ProjectsList/>;
  else if(route.page==='tasks') pageEl=<TasksGlobalPage/>;
  else pageEl=<ProjectDetail projectId={route.projectId} tab={route.tab}/>;

  return <StoreCtx.Provider value={store}>
    <div className={cx('app',collapsed&&'collapsed')}>
      <Sidebar collapsed={collapsed} setCollapsed={setCollapsed} route={route} navigate={navigate}/>
      <div className="main">
        <Topbar route={route} project={projForCrumb} onOpenCopilot={openCopilot} theme={theme} setTheme={setTheme} unreadRisks={unreadRisks}/>
        <div className="content">{pageEl}</div>
      </div>
    </div>
    <nav className="bottom-nav">
      <button className={route.page==='dashboard'?'active':''} onClick={()=>navigate('#/dashboard')}><Icon name="grid" size={19}/>Home</button>
      <button className={(route.page==='projects'||route.page==='project')?'active':''} onClick={()=>navigate('#/projects')}><Icon name="building" size={19}/>Projects</button>
      <button className={route.page==='tasks'?'active':''} onClick={()=>navigate('#/tasks')}><Icon name="check-square" size={19}/>Tasks</button>
      <button onClick={()=>openCopilot({type:'portfolio'})}><Icon name="sparkle" size={19}/>Copilot</button>
    </nav>
    {copilotOpen && <AICopilotPanel state={state} dispatch={dispatch} scope={copilotScope} setScope={setCopilotScope} onClose={()=>setCopilotOpen(false)} navigate={navigate} messages={copilotMsgs} setMessages={setCopilotMsgs}/>}
  </StoreCtx.Provider>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
